[workspace]
authors = ["the authors"]
channels = ["sofar_fw", "conda-forge", "memfault"]
name = "pixi"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "win-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.10"
arm-none-eabi-gcc = ">=13.2.rel1,<14"
clang-tools = ">=15.0.3,<19"
cmake = "~=3.29.0"
cppcheck = ">=2.18.3,<3"
gcovr = ">=8.3,<9"
make = "~=4.3.0"
multi-arch-gdb = ">=12.1,<16"
openocd-xpack = "~=0.12.0"
pre_commit = ">=4.3.0,<5"
pyserial = ">=3.5,<4"

[pypi-dependencies]
cbor2 = ">=5.7.1, <6"
click = ">=8.3.0, <9"
crcmod = ">=1.7, <2"
cryptography = ">=42.0"
gitpython = ">=3.1.45, <4"
intelhex = ">=2.3.0, <3"
memfault-cli = "==1.0"
pytest = ">=8.4.2, <9"
python-dotenv = ">=1.2.1, <2"
bitstring = "==4.2"
pyserial = ">=3.5,<4.0"
regex = ">=2025.10.23, <2026"
func-timeout = ">=4.3.5, <5"
pytest-order = ">=1.3.0, <2"
